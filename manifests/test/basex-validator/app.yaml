apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: basex-validator
  namespace: journal--test
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: journal-team-deployment
    namespace: flux-system
  path: ./kustomizations/basex-validator
  prune: true
  targetNamespace: journal--test
  images:
    - name: ghcr.io/elifesciences/basex-validator # {"$imagepolicy": "journal--test:basex-validator:name"}
      newTag: 20260728102433.0.0-g552551d-30350623605-1 # {"$imagepolicy": "journal--test:basex-validator:tag"}
  patches:
    - patch: |
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: basex-validator
          annotations:
            traefik.ingress.kubernetes.io/service.serverstransport: basex-validator-transport@kubernetescrd
      target:
        kind: Ingress
        name: basex-validator
  postBuild:
    substitute:
      replicas: "1"
      hostname: basex-validator.test.elifesciences.org
      env: test
      secret_name: basex-validator-secret
