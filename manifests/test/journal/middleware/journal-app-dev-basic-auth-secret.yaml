apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: journal-app-dev-basic-auth
  namespace: journal--test
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: journal-app-dev-basic-auth
    creationPolicy: Owner
    template:
      data:
        users: |
          {{ .content_preview_basic_auth_user | toString }}:{{ .content_preview_basic_auth_password_hash | toString }}
  dataFrom:
  - extract:
      key: journal-team/journal/prod
