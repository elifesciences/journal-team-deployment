apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: journal-app-continuumtest
  namespace: journal--test
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: journal-team-deployment
    namespace: flux-system
  path: ./kustomizations/journal
  prune: true
  targetNamespace: journal--test
  images:
    - name: ghcr.io/elifesciences/journal # {"$imagepolicy": "journal--test:journal-app-latest-master:name"}
      newTag: feature-test-and-improve-github-actions-pipeline-39625662f70b2621166141761583fc3661b2f08d-20260727.1507 # {"$imagepolicy": "journal--test:journal-app-latest-master:tag"}
  nameSuffix: -continuumtest
  postBuild:
    substitute:
      # deployment vars
      env: test
      instance_name: journal-app-continuumtest
      hostname: journal--continuumtest.elifesciences.org
      cert_manager_issuer: "letsencrypt"
      journal_secret_parameters_secret_name: journal-app-dev-secret-parameters
      api_url: https://api.test.elifesciences.org
      api_url_search_page: https://api.test.elifesciences.org
      epp_url: http://epp-client.epp--prod:3000
      observer_url: http://prod--observer.elife.internal
      pubpub_url: https://elife-container.pubpub.org
      hubspot_url: https://connect.elifesciences.org
      cache_uri: redis://app-continuumtest-journal-dragonfly-cache:6379
      session_uri: redis://app-continuumtest-journal-dragonfly-sessions:6379
