apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: journal-app-latest-symfony7-branch
  namespace: journal--prod
spec:
  imageRepositoryRef:
    name: journal
  filterTags:
    # branch-sha-time
    pattern: '^symfony7-[a-fA-F0-9]+-(?P<ts>.*)'
    extract: '$ts'
  policy:
    numerical:
      order: asc
