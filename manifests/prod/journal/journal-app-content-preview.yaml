apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: journal-app-content-preview
  namespace: journal--prod
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: journal-team-deployment
    namespace: flux-system
  path: ./kustomizations/journal
  prune: true
  targetNamespace: journal--prod
  images:
    - name: ghcr.io/elifesciences/journal # {"$imagepolicy": "journal--prod:journal-app-latest-master:name"}
      newTag: master-fedc16a8e12ef8a95512d0fef3307623762fecf2-20260728.1417 # {"$imagepolicy": "journal--prod:journal-app-latest-master:tag"}
  nameSuffix: -content-preview
  postBuild:
    substitute:
      # deployment vars
      env: test
      instance_name: journal-app-content-preview
      hostname: journal-content-preview.test.elifesciences.org
      cert_manager_issuer: "letsencrypt"
      journal_secret_parameters_secret_name: journal-preview-secret-parameters
      api_url: https://api.test.elifesciences.org
      api_url_search_page: https://api.test.elifesciences.org
      epp_url: http://epp-client.epp--prod:3000
      observer_url: http://prod--observer.elife.internal
      pubpub_url: https://elife-container.pubpub.org
      hubspot_url: https://connect.elifesciences.org
      cache_uri: redis://preview-journal-dragonfly-cache:6379
      session_uri: redis://preview-journal-dragonfly-sessions:6379
