apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: journal-app-content-preview
  namespace: journal--prod
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: journal-team-deployment
    namespace: flux-system
  path: ./kustomizations/journal
  prune: true
  targetNamespace: journal--prod
  images:
    - name: ghcr.io/elifesciences/journal # {"$imagepolicy": "journal--prod:journal-app-latest-feature-branch:name"}
      newTag: master-436f57c1df4e4f7ed7bfff0747f11be7319a4abb-20261111.1553 # {"$imagepolicy": "journal--prod:journal-app-latest-feature-branch:tag"}
  nameSuffix: -content-preview
  patches:
    - patch: |
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: journal-app
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: journal-prod-content-preview-basic-auth@kubernetescrd
      target:
        kind: Ingress
        name: journal-app
  postBuild:
    substitute:
      # deployment vars
      env: prod
      instance_name: journal-app-content-preview
      hostname: journal-content-preview.test.elifesciences.org
      cert_manager_issuer: "letsencrypt"
      journal_secret_parameters_secret_name: journal-preview-secret-parameters
      api_url: https://api.elifesciences.org
      api_url_search_page: https://api.elifesciences.org
      epp_url: http://epp-client.epp--prod:3000
      observer_url: http://prod--observer.elife.internal
      pubpub_url: https://elife-container.pubpub.org
      hubspot_url: https://connect.elifesciences.org
      cache_uri: redis://preview-journal-dragonfly-cache:6379
      session_uri: redis://preview-journal-dragonfly-sessions:6379
