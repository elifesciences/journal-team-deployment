apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: journal-app-symfony7
  namespace: journal--prod
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: journal-team-deployment
    namespace: flux-system
  path: ./kustomizations/journal-symfony7
  prune: true
  targetNamespace: journal--prod
  images:
    - name: ghcr.io/elifesciences/journal # {"$imagepolicy": "journal--prod:journal-app-latest-symfony7-branch:name"}
      newTag: symfony7-04aa203b8ffeda914a8b506d9613573e0ece748e-20261022.0909 # {"$imagepolicy": "journal--prod:journal-app-latest-symfony7-branch:tag"}
  nameSuffix: -symfony7
  patches:
    - patch: |
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: journal-app
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: journal-prod-journal-app-ip-allowlist@kubernetescrd,traefik-ping-fastly@kubernetescrd
      target:
        kind: Ingress
        name: journal-app
    - patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: journal-app
        spec:
          replicas: 2
          template:
            spec:
              containers:
              - name: journal
                resources:
                  requests:
                    cpu: 500m
                    memory: 2Gi
      target:
        kind: Deployment
        name: journal-app
  postBuild:
    substitute:
      # deployment vars
      env: prod
      instance_name: journal-app-symfony7
      hostname: journal-symfony7.elifesciences.org
      cert_manager_issuer: "letsencrypt"
      journal_secret_parameters_secret_name: journal-prod-secret-parameters
      api_url: https://api.prod.elifesciences.org
      api_url_search_page: https://api.prod.elifesciences.org
      epp_url: http://epp-client.epp--prod:3000
      observer_url: http://prod--observer.elife.internal
      pubpub_url: https://elife-container.pubpub.org
      hubspot_url: https://connect.elifesciences.org
      cache_uri: redis://symfony7-journal-dragonfly-cache:6379
      session_uri: redis://symfony7-journal-dragonfly-sessions:6379
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-access-symfony7
  namespace: journal--prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-elife-oauth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: "journal-prod-dev-access-sym7.elifesciences.org"
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: journal-app-symfony7
                port:
                  number: 80
  tls:
    - hosts:
        - "journal-prod-dev-access-sym7.elifesciences.org"
      secretName: "journal-prod-dev-access-sym7.elifesciences.org-tls"
