apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - files:
      - health-dashboard.json
    name: journal-dashboards
patches:
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: journal-dashboards
        labels:
          grafana_dashboard: "1"