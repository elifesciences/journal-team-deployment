apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: journal-symfony7-dragonfly
  namespace: journal--prod
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: journal-team-deployment
    namespace: flux-system
  path: ./kustomizations/journal/dragonfly
  prune: true
  targetNamespace: journal--prod
  # avoid name collision with journal app
  namePrefix: symfony7-
  postBuild:
    substitute:
      env: test
      instance_name: dragonfly-journal-content-preview
