geo $dollar {
    default "$";
}
map $http_x_forwarded_host $robots_disallow {
    default "/";
    "~^(?<first_host>(?:[^,]+\.)?elifesciences\.org)\s*(?:,|$)" "";
}
map $http_x_forwarded_host $http_x_forwarded_host_filtered {
    default "";
    "~^(?<first_host>(?:[^,]+\.)?elifesciences.org)\s*(?:,|$)" $first_host;
}
# Canonical redirects should target the real public host Fastly forwarded
# (extracted above into $http_x_forwarded_host_filtered), falling back to
# ${hostname} for direct/internal requests that have no X-Forwarded-Host.
# Requests coming in on the dev-access endpoint should stay on it rather
# than bounce to the IP-allowlisted canonical prod host.
map $http_x_forwarded_host_filtered $canonical_host_from_xfh {
    default $http_x_forwarded_host_filtered;
    "" ${hostname};
}
map $host $canonical_host {
    default $canonical_host_from_xfh;
    "journal-prod-dev-access.elifesciences.org" $host;
}

server {
    # Evaluated once here (server scope), before any location's rewrite
    # regex runs. $canonical_host depends on regex captures (map blocks
    # above), and evaluating it lazily inside a rewrite's replacement
    # string would clobber that rewrite's own $1/$2 captures. Caching it
    # into a plain variable up front avoids that.
    set $canonical_host_resolved $canonical_host;
    server_name localhost;
    listen 80 default_server;
    root /srv/journal/web;

    location ~ \..*/.*\.php$ {
        return 403;
    }

    location / {
        try_files $uri /app.php$is_args$query_string;
        add_header Cache-Control "public, max-age=604800";

        rewrite '^/(?:cgi|content|elife)/.+?/(?:e|eLife\.)?([0-9]{5,})(v[0-9]+)?' 'https://$canonical_host_resolved/articles/$1$2' permanent;
        rewrite '^/keywords/(.*)$' 'https://$canonical_host_resolved/search?for=$1' permanent;
        rewrite '^/(.*)/$' 'https://$canonical_host_resolved/$1' permanent;
        rewrite '^/About$' 'https://$canonical_host_resolved/about' permanent;
        rewrite '^/Community$' 'https://$canonical_host_resolved/community' permanent;
        rewrite '^/Events$' 'https://$canonical_host_resolved/events' permanent;
        rewrite '^/Labs$' 'https://$canonical_host_resolved/labs' permanent;

        # rewrite to external URLs have to go here
        rewrite '^/highlights$' 'https://crm.elifesciences.org/crm/highlights' permanent;
        rewrite '^/inside-elife/719e655d/elife-latest-the-costs-of-publishing$' 'https://reviewer.elifesciences.org/author-guide/fees' permanent;
        rewrite '^/inside-elife/719e655d$' 'https://reviewer.elifesciences.org/author-guide/fees' permanent;
