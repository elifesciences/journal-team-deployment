---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: labs-posts
  namespace: journal
  annotations:
    konghq.com/preserve-host: "false"
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: api-gateway
    namespace: journal
  rules:
  - backendRefs:
    - name: ${journal_cms_service_name}
      namespace: journal
      kind: Service
      port: ${journal_cms_port}
    # Read-only methods: PHP only parses POST bodies (CVE-2026-109618, CVE-2026-109619)
    matches:
    - path:
        type: PathPrefix
        value: /labs-posts
      method: GET
    - path:
        type: PathPrefix
        value: /labs-posts
      method: HEAD
    - path:
        type: PathPrefix
        value: /labs-posts
      method: OPTIONS
