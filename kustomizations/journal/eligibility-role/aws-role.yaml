apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: journal-eligibility
  namespace: journal
spec:
  name: elife-journal-eligibility-${env}
  tags:
  - key: Project
    value: journal
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {
            "Federated": "${aws_oidc_arn}"
          },
          "Action": "sts:AssumeRoleWithWebIdentity",
          "Condition": {
            "ForAnyValue:StringEquals": {
              "${aws_oidc_url}:sub": [
                "system:serviceaccount:${irsa_namespace}:journal-eligibility",
                "system:serviceaccount:${irsa_namespace}:journal-eligibility-dev"
              ]
            }
          }
        }
      ]
    }
  inlinePolicies:
    giveAccessToEligibilityJson: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Action": [
              "s3:GetObject"
            ],
            "Effect": "Allow",
            "Resource": [
              "${eligibility_json_s3_object_arn}"
            ]
          }
        ]
      }
